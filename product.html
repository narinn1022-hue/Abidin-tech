<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Abidin Tech International</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<style>
    body {
        min-height: 100vh;
        background: linear-gradient(#0f2027, #203a43, #2c5364);
        color: white;
    }
    .product-card {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        padding: 20px;
        height: 300px;
        width: 300px;
        text-align: center;
    }

    .product-card img {
        width: 100%;
        height: 65%;
        object-fit: contain;
    }

    .product-card h5 {
    color: white;
    font-size: 1.2rem;
    margin: 5px 0;
    }

    .product-card p {
    color: white;
    margin-bottom: 10px;
    }

    .btn-buy {
    width: 100%;
    max-width: 500px;
    padding: 10px;
    background-color: #4285f4;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    }

    .summary-box {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 15px;
        padding: 20px;
    }
</style>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">
                <i class="bi bi-pc-display"></i> Abidin Tech International
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="dashboard.html">Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="aboutus.html">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="product.html">Product</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
<div class="container py-5">
    <h2 class="text-center mb-4">Computer Products</h2>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="product-card">
                <img src="headphone.png">
                <h5>Headphone</h5>
                <p>Rp 150.000</p>
                <button class="btn btn-primary" onclick="addProduct('Headphone', 150000)">Buy</button>
            </div>
        </div>
        <div class="col-md-4">
            <div class="product-card">
                <img src="smartwatch.png">
                <h5>Smartwatch</h5>
                <p>Rp 150.000</p>
                <button class="btn btn-primary" onclick="addProduct('Smartwatch', 150000)">Buy</button>
            </div>
        </div>
        <div class="col-md-4">
            <div class="product-card">
                <img src="speaker.png">
                <h5>Speaker</h5>
                <p>Rp 100.000</p>
                <button class="btn btn-primary" onclick="addProduct('Speaker', 100000)">Buy</button>
            </div>
        </div>
    </div>
    <div class="row mt-5">
        <div class="col-md-8 mx-auto">
            <div class="summary-box">
                <h4>Purchase Details</h4>
                <div id="itemList"></div>
                <hr>
                <h5>Total Price:</h5>
                <h3 id="totalPrice">Rp 0</h3>
                <button class="btn btn-success w-100 mt-3" onclick="payNow()">Pay Now</button>
            </div>
        </div>
    </div>
</div>
<script>
    let cart = {};
    let total = 0;

    let itemList = document.getElementById("itemList");
    let totalPrice = document.getElementById("totalPrice");

    function addProduct(name, price) {
        if (cart[name]) {
            cart[name].qty += 1;
        } else {
            cart[name] = {
                qty: 1,
                price: price
            };
        }
        total += price;
        updateCard()
    }

    function updateCard() {
        itemList.innerHTML = "";
        for (let item in cart) {
            let div = document.createElement("div");
            div.innerHTML = `
            <strong>${item}</strong>
            x${cart[item].qty}
            = Rp ${(cart[item].qty * cart[item].price).toLocaleString()}
            `;
            itemList.appendChild(div);
        }
        totalPrice.innerText = "Rp " + total.toLocaleString();
    }

    function payNow() {
        alert("Thank you for your purchase!");
    }
</script>
</body>
</html>
